<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniLearn // AI Curriculum & Roadmap Architect</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="top-nav">
    <div class="brand">
      <div class="logo-dot"></div>
      <span>OmniLearn</span>
    </div>
    <div class="nav-status">
      <span id="active-model-display">Gemini 2.5 Flash // Standby</span>
    </div>
  </header>

  <main class="container">
    <section class="hero-section">
      <h1 id="roadmap-title">Universal AI Roadmap Architect</h1>
      <p id="roadmap-subtitle">Specify any academic, technical, or creative field to generate an adaptive, fully fleshed-out curriculum.</p>

      <form id="search-form" class="controls-card">
        <div class="selectors-row">
          <div class="select-group">
            <label for="model-select">AI INFERENCE MODEL</label>
            <select id="model-select">
              <option value="gemini-2.5-flash">Gemini 2.5 Flash (Adaptive Multimodal)</option>
            </select>
          </div>
          <div class="select-group">
            <label for="depth-select">TARGET DEPTH</label>
            <select id="depth-select">
              <option value="Standard">Standard (Core Principles)</option>
              <option value="Comprehensive">Comprehensive (Deep Dive)</option>
              <option value="Accelerated">Accelerated (Crash Course)</option>
            </select>
          </div>
        </div>

        <div class="input-row">
          <input type="text" id="prompt-input" placeholder="e.g. Full-Stack Web Development, Astrophysics, Rust..." required autocomplete="off" />
          <button type="submit" id="submit-btn">
            <span class="btn-text">Generate Blueprint</span>
            <span class="btn-icon">➔</span>
          </button>
        </div>
      </form>
    </section>

    <section class="progress-section">
      <div id="progress-text">0% Completed (0/0 Modules)</div>
    </section>

    <section id="roadmap-container" class="timeline-container">
      <!-- Roadmap nodes injected dynamically via script.js -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
